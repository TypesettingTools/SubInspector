name: Build and test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            arch: arm64
            args: --wrap-mode=forcefallback -Dzlib=enabled -Dlibass:asm=enabled
            binary: libSubInspector.dylib
            artifact: SubInspector-macos-arm64
          - name: macOS x86_64 (cross)
            os: macos-15
            arch: x86_64
            args: --wrap-mode=forcefallback -Dzlib=enabled -Dlibass:asm=enabled --cross-file tools/ci/macos-x86_64.ini
            binary: libSubInspector.dylib
            artifact: SubInspector-macos-x86_64
          - name: Windows x64
            os: windows-2025
            arch: x64
            args: --wrap-mode=forcefallback -Dzlib=enabled -Dlibass:asm=enabled -Db_vscrt=mt
            binary: SubInspector.dll
            artifact: SubInspector-windows-x64
          - name: Linux (system dependencies)
            os: ubuntu-24.04
            args: --wrap-mode=nofallback -Dbuildtype=debugoptimized -Dzlib=enabled
          - name: Linux (without zlib)
            os: ubuntu-24.04
            args: --wrap-mode=nofallback -Dzlib=disabled

    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install meson==1.12.0 ninja==1.13.0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install Lua wrapper test tools (macOS)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: |
          brew install luajit luarocks
          luarocks --lua-version=5.1 --lua-dir="$(brew --prefix luajit)" --tree="$RUNNER_TEMP/luarocks" install moonscript 0.6.0
          echo "$RUNNER_TEMP/luarocks/bin" >> "$GITHUB_PATH"
      - name: Install Lua wrapper test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "$env:RUNNER_TEMP\luajit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:RUNNER_TEMP\luajit\src"
          cmd /c msvcbuild.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          "$env:RUNNER_TEMP\luajit\src" >> $env:GITHUB_PATH
          $archive = "$env:RUNNER_TEMP\moonscript.zip"
          Invoke-WebRequest https://github.com/leafo/moonscript/releases/download/v0.6.0/moonscript-v0.6.0-windows-x86_64.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd91b2aec25caf71a551268c1d50d635708e556641ba0e19dd7f24d4a68d93e7c') {
            throw 'MoonScript archive checksum mismatch'
          }
          Expand-Archive $archive "$env:RUNNER_TEMP\moonscript"
          "$env:RUNNER_TEMP\moonscript" >> $env:GITHUB_PATH
      - name: Enable Intel tests through Rosetta
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm libass-dev fonts-dejavu-core luajit luarocks liblua5.1-0-dev
          sudo luarocks --lua-version=5.1 install moonscript 0.6.0

      - name: Configure
        run: meson setup build ${{ matrix.args }}
      - name: Build
        run: meson compile -C build
      - name: Check Lua wrapper tests are enabled
        if: runner.os != 'macOS' || matrix.arch != 'x86_64'
        shell: bash
        run: meson test -C build --list | grep -q aegisub-wrapper
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Check binary architecture and runtime dependencies
        if: matrix.artifact
        run: python tools/ci/check-binary.py build/src/${{ matrix.binary }} ${{ matrix.arch }}
      - name: Check Linux uses patched libass
        if: runner.os == 'Linux'
        run: |
          ldd build/src/libSubInspector.so
          if ldd build/src/libSubInspector.so | grep -q 'libass\.so'; then
            echo 'Unexpected runtime dependency on system libass'
            exit 1
          fi
      - name: Archive sources and package binaries
        if: matrix.artifact
        run: |
          meson dist -C build --include-subprojects --no-tests
          python tools/ci/package.py build ${{ matrix.binary }}
      - name: Upload binaries and sources
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/artifact/
          if-no-files-found: error
      - name: Upload build and test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ strategy.job-index }}
          path: build/meson-logs/
